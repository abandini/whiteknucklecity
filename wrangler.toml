name = "white-knuckle-city"
main = "src/index.js"
compatibility_date = "2026-07-01"

# Custom domains — wrangler provisions the managed DNS records + certs on deploy.
routes = [
  { pattern = "whiteknucklecity.com", custom_domain = true },
  { pattern = "www.whiteknucklecity.com", custom_domain = true },
]

# Static site (index.html + assets) is served directly from ./public.
# The Worker only runs for requests with no matching file — e.g. POST /api/notify.
[assets]
directory = "./public"
binding = "ASSETS"
# Serve the branded 404 for any unmatched path.
not_found_handling = "404-page"
# Without this, requests matching a static file bypass the Worker entirely —
# which silently disables the redirects and security headers in src/index.js.
run_worker_first = true

# RESEND_API_KEY is set as a secret (never committed):
#   npx wrangler secret put RESEND_API_KEY

# KV: alert dedup guards (alert:<league>:<gameId>) + cap/tee vote counters.
[[kv_namespaces]]
binding = "WKC"
id = "6c350522fc024620bb00ae2a4d19aa8b"

# Scheduled work:
#   */5  — Knuckle Alerts: check the index, email the audience when a live game crosses 85.
#   0 4  — daily ~midnight ET (04:00 UTC in EDT): refresh the odds/index caches so the
#          morning board is clean after late games. (The live meter is already real-time;
#          this just guarantees a daily rollover + keeps the dynamic sitemap's date fresh.)
[triggers]
crons = ["*/5 * * * *", "0 4 * * *"]
